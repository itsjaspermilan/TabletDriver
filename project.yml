name: TabletDriver
options:
  bundleIdPrefix: com.itsjaspermilan
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: NO
    DEVELOPMENT_TEAM: T4H858M58C
    CODE_SIGN_STYLE: Automatic
targets:
  TabletDriverKit:
    type: library.static
    platform: macOS
    sources: [Sources/TabletDriverKit]
    settings:
      base:
        # Xcode's synthesized "Copy Swift Objective-C Interface Header" script
        # phase for this static library target uses `ditto` to overwrite its
        # output in CONFIGURATION_BUILD_DIR. Script sandboxing only grants
        # write access to that literal destination file, not its containing
        # directory, so overwriting it on any rebuild after the first fails
        # with "Operation not permitted". Disable sandboxing for this target
        # to avoid it.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
  TabletDriverApp:
    type: application
    platform: macOS
    sources:
      - Sources/TabletDriverApp
      - Resources/AppIcon.icon
    dependencies:
      - target: TabletDriverKit
    info:
      path: Resources/Info.plist
      properties:
        CFBundleName: TabletDriver
        CFBundleDisplayName: TabletDriver
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "14.0"
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.graphics-design
    settings:
      base:
        PRODUCT_NAME: TabletDriver
        PRODUCT_BUNDLE_IDENTIFIER: com.itsjaspermilan.TabletDriver
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: NO
  TabletDriverKitTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests/TabletDriverKitTests]
    dependencies:
      - target: TabletDriverKit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  TabletDriver:
    build:
      targets:
        TabletDriverApp: all
    test:
      targets: [TabletDriverKitTests]
    run:
      config: Debug
